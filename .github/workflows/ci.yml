name: CI

# Runs on every push and PR to main. Vercel deploys from main, so this is the
# only thing standing between a bad commit and production.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push supersedes an in-flight run for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The build regenerates the CSP hash for the inline JSON-LD block. If that
      # leaves vercel.json dirty, the committed CSP would block structured data
      # in production, so fail rather than deploy it.
      - name: CSP hash is committed
        run: |
          if ! git diff --quiet -- vercel.json; then
            echo "::error::vercel.json CSP hash is stale. Run 'npm run build' and commit the result."
            git diff -- vercel.json
            exit 1
          fi
